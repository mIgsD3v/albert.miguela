services:
  server:
    build:
      context: .
    ports:
      - 5173:5173
    environment:
      NODE_ENV: development
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .git/
            - dist/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json
